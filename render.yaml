services:
  - type: keyvalue
    name: secure-contact-cache
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: secure-contact-api
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-contact-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: secure-contact-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: secure-contact-api
      - key: JWT_AUDIENCE
        value: secure-contact-api-users
      - key: CORS_ORIGINS
        value: '["https://secure-contact-api.onrender.com"]'
      - key: API_BASE_URL
        value: https://secure-contact-api.onrender.com
      - key: FRONTEND_RESET_URL
        value: https://secure-contact-api.onrender.com/docs
      - key: EMAIL_BACKEND
        value: console

databases:
  - name: secure-contact-db
    region: frankfurt
    plan: free
    databaseName: secure_contacts
